<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>stage</title>
<style>
html,body{margin:0;height:100%;background:#16161a;overflow:hidden;font:13px/1.3 system-ui,sans-serif;color:#ddd}
#stage{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0}
#stage>*{position:absolute;left:0;top:0}
#ui{position:fixed;left:0;right:0;bottom:0;height:36px;display:flex;gap:10px;align-items:center;padding:0 12px;background:#000a}
#ui input{flex:1} #ui button{width:64px} #err{position:fixed;left:12px;top:12px;right:12px;white-space:pre-wrap;color:#ff8a80;font:12px monospace;z-index:99}
body.render #ui,body.clean #ui{display:none}
</style></head><body>
<div id="stage"></div>
<div id="ui"><button id="play">pause</button><input id="scrub" type="range" min="0" step="1"><span id="tc"></span></div>
<div id="err"></div>
<script src="motion.js"></script>
<script>
'use strict';
{ // block scope: scene.js may use any top-level name
const Q=new URLSearchParams(location.search), RENDER=Q.has('render');
const showErr=m=>{ document.getElementById('err').textContent+=m+'\n'; };
if(!RENDER) addEventListener('error',e=>showErr(e.message));
const load=src=>new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>no(new Error('cannot load '+src)); document.head.appendChild(s); });
// ?set=k=v,k2=v2 (render.js --set) becomes the global PARAMS, readable while SCENE is defined: variants without copying the scene
window.PARAMS=Object.fromEntries((Q.get('set')||'').split(',').filter(Boolean).map(kv=>{ const [k,v='true']=kv.split(/=(.*)/s); return [k,v==='true'?true:v==='false'?false:v!==''&&!isNaN(+v)?+v:v]; }));
// Math.random is seeded: the same stream in setup on every page (parallel render pages build identical scenes), and reseeded from
// the time before each render call, so a stray Math.random in render still gives the same frame every time (M.rng/M.hash remain the way to do it)
const seedRandom=seed=>{ let a=seed>>>0; Math.random=()=>{ a=(a+0x6d2b79f5)>>>0; let q=Math.imul(a^a>>>15,1|a); q=q+Math.imul(q^q>>>7,61|q)^q; return ((q^q>>>14)>>>0)/4294967296; }; };
seedRandom(0x2545f491);
(async()=>{
  await load(Q.get('scene')||'scene.js');
  const S=typeof SCENE!=='undefined'?SCENE:window.SCENE; if(!S) throw new Error('scene.js must define const SCENE={...}');
  if(typeof S.render!=='function') throw new Error('SCENE.render(t,stage) is missing: it sets every animated property from t');
  for(const k of ['width','height','fps','duration']) if(S[k]!==undefined&&!(S[k]>0)) throw new Error(`SCENE.${k} must be a positive number, not ${JSON.stringify(S[k])}`);
  const W=S.width||1920, H=S.height||1080, fps=S.fps||30, duration=S.duration||5, bg=S.background||'#000', frames=Math.round(duration*fps);
  const SV='http://www.w3.org/2000/svg', el=document.getElementById('stage');
  el.style.width=W+'px'; el.style.height=H+'px'; if(bg!=='transparent') el.style.background=bg;
  const layer=(tag,z,ns)=>{ const e=ns?document.createElementNS(SV,tag):document.createElement(tag); e.style.zIndex=z; el.appendChild(e); return e; };
  const svg=layer('svg',1,true); M.set(svg,{width:W,height:H,viewBox:`0 0 ${W} ${H}`,overflow:'hidden'});
  const defs=M.svg('defs',{},svg), world=M.svg('g',{id:'world'},svg), screen=M.svg('g',{id:'screen'},svg);
  const html=layer('div',3); html.style.cssText+=`;width:${W}px;height:${H}px;z-index:3`;
  const dpr=window.devicePixelRatio||1, layers=new Map(); let loads=0;
  const stage={ W,H,fps,duration,frames,svg,defs,world,screen,html,el,dpr,t:0,frame:0,render:RENDER,
    $:s=>el.querySelector(s), $$:s=>[...el.querySelectorAll(s)],
    // insert SVG markup (default into the camera-moved world group); returns the first element added
    add(markup,parent=world){ const n=parent.children.length; parent.insertAdjacentHTML('beforeend',markup); return parent.children[n]; },
    // fetch an SVG file (logo, character art) and insert it as live, animatable markup; returns its <svg> element
    // Its <style> rules are scoped to this copy and colliding ids are renamed to <file>_<n>__<id> (with their url(#…)/href refs), so
    // exports that all use .cls-1 or #gradient1 (Illustrator, Figma) can be loaded side by side, or the same file twice
    async load(url,parent=world){ const r=await fetch(url); if(!r.ok) throw new Error('cannot load '+url+' ('+r.status+')');
      const doc=new DOMParser().parseFromString(await r.text(),'image/svg+xml'), root=doc.documentElement;
      if(root.nodeName!=='svg'||doc.querySelector('parsererror')) throw new Error(url+' is not valid SVG');
      const tag=url.split('/').pop().replace(/\.\w+$/,'').replace(/[^\w-]/g,'_')+'_'+(++loads); if(!root.id) root.id=tag;
      const ren={}; root.querySelectorAll('[id]').forEach(e=>{ if(e!==root&&document.getElementById(e.id)){ ren[e.id]=tag+'__'+e.id; e.id=ren[e.id]; } });
      const fix=v=>v.replace(/url\(\s*['"]?#([^)'"\s]+)['"]?\s*\)/g,(m,id)=>ren[id]?`url(#${ren[id]})`:m);
      root.querySelectorAll('*').forEach(e=>{ for(const a of [...e.attributes]){ if(/(^|:)href$/.test(a.name)&&a.value[0]==='#'&&ren[a.value.slice(1)]) e.setAttributeNS(a.namespaceURI,a.name,'#'+ren[a.value.slice(1)]); else if(a.value.includes('url(')) a.value=fix(a.value); } });
      root.querySelectorAll('style').forEach(st=>{ st.textContent=fix(st.textContent).replace(/(^|\})(\s*)([^{}@][^{}]*)\{/g,(m,b,w,sel)=>b+w+sel.split(',').map(x=>`#${root.id} ${x.trim()}`).join(', ')+'{'); });
      return parent.appendChild(document.importNode(root,true)); },
    // hi-DPI canvas layer drawn in stage units. where: 'under' (behind the SVG) or 'over' (between SVG and HTML). type '2d' returns the context, others the canvas
    canvas(name,where='over',type='2d'){ const c=layer('canvas',where==='under'?0:2); c.id=name; c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); c.style.width=W+'px'; c.style.height=H+'px';
      if(type!=='2d') return c; const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
      g.clear=()=>{ g.save(); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,c.width,c.height); g.restore(); }; return g; },
    // camera over the world group: centre on (x,y), zoom, roll r (deg). Screen-space group and HTML layer do not move
    camera({x=W/2,y=H/2,zoom=1,r=0}={}){ const cam=(g,d)=>g.setAttribute('transform',`translate(${W/2} ${H/2}) rotate(${r/d}) scale(${1+(zoom-1)/d}) translate(${-(W/2+(x-W/2)/d)} ${-(H/2+(y-H/2)/d)})`);
      cam(world,1); for(const [g,d] of layers) cam(g,d); },
    // parallax: a group the camera moves at 1/depth of its pan, zoom and roll. depth > 1 sits behind the world (far hills), < 1 in front (foreground leaves)
    layer(depth,name){ if(!(depth>0)) throw new Error('stage.layer(depth): depth must be > 0'); const g=M.svg('g',{id:name||`layer-${depth}`,'data-depth':depth});
      // back to front by depth: deeper layers first, the world at depth 1, then nearer layers, then the screen group
      const d=c=>layers.get(c), next=[...svg.children].find(depth>1?c=>c===world||d(c)>1&&d(c)<depth:c=>c===screen||d(c)<1&&d(c)<depth);
      svg.insertBefore(g,next); layers.set(g,depth); return g; },
    font(family,url,desc={}){ const f=new FontFace(family,`url("${url}")`,desc); document.fonts.add(f); return f.load(); },
    // a Google Font by name, every listed weight loaded before the first frame (needs network). webfont('Inter',[400,700]), webfont('Fraunces',[400],'ital')
    async webfont(family,weights=[400,700],ital=false){ const q=ital?`ital,wght@${[0,1].flatMap(i=>weights.map(w=>i+','+w)).join(';')}`:`wght@${weights.join(';')}`;
      const r=await fetch(`https://fonts.googleapis.com/css2?family=${encodeURIComponent(family).replace(/%20/g,'+')}:${q}&display=block`); if(!r.ok) throw new Error(`webfont ${family}: ${r.status} (is the name right, and is there network access?)`);
      const css=await r.text(), faces=[...css.matchAll(/@font-face\s*{([^}]*)}/g)].map(m=>{ const b=m[1], g=k=>(b.match(new RegExp(k+':\\s*([^;]+);'))||[])[1];
        const f=new FontFace(family,`url(${(b.match(/url\(([^)]+)\)/)||[])[1]})`,{weight:g('font-weight')||'400',style:g('font-style')||'normal',unicodeRange:g('unicode-range')||'U+0-10FFFF'}); document.fonts.add(f); return f.load(); });
      await Promise.all(faces); },
    image(url){ const i=new Image(); i.src=url; return i.decode().then(()=>i); },
  };
  window.stage=stage;
  if(S.setup) await S.setup(stage);
  await Promise.all([...el.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})).concat([...svg.querySelectorAll('image')].map(i=>stage.image(i.href.baseVal).catch(()=>{}))));
  await document.fonts.ready;
  const seek=t=>{ t=M.clamp(+t||0,0,duration); stage.t=t; stage.frame=Math.round(t*fps); seedRandom(Math.round(t*1e6)^0x9e3779b9); S.render(t,stage);
    for(const a of document.getAnimations()){ a.pause(); a.currentTime=t*1000; } }; // CSS @keyframes and element.animate() follow the clock too
  if(Q.get('ref')){ const r=layer('img',9); r.src=Q.get('ref'); const [x,y,w,h]=(Q.get('refbox')||`0,0,${W},${H}`).split(',').map(Number);
    r.style.cssText+=`;left:${x}px;top:${y}px;width:${w}px;height:${h}px;object-fit:contain;opacity:${Q.get('refop')||.5};z-index:9`; await r.decode().catch(()=>{}); }
  seek(+Q.get('t')||0);
  // warn about fonts the scene names but the browser does not have: they silently render in a fallback face
  { const g=document.createElement('canvas').getContext('2d'), w=f=>{ g.font=`40px ${f}`; return g.measureText('Hamburgefonstiv 0123 WMy').width; }, fams=new Set();
    for(const e of el.querySelectorAll('*')){ if(![...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())) continue; fams.add(getComputedStyle(e).fontFamily.split(',')[0].trim().replace(/^["']|["']$/g,'')); }
    const generic=['serif','sans-serif','monospace','cursive','fantasy','system-ui','ui-sans-serif','ui-serif','ui-monospace','math','emoji'];
    for(const f of fams) if(!generic.includes(f)&&['monospace','serif','sans-serif'].every(b=>w(`"${f}", ${b}`)===w(b))) console.warn(`FONT FALLBACK: "${f}" is not available, so its text renders in a fallback face. Load it in setup with await stage.font(family,url) or await stage.webfont(family,[weights]), or name the substitute.`); }
  const audioUrl=S.audio?new URL(S.audio,location.href).href:null; // the soundtrack: render.js muxes it, the live preview plays it
  window.__anim={W,H,fps,duration,frames,background:bg,audio:audioUrl,seek};
  if(RENDER){ document.body.classList.add('render'); document.documentElement.style.background=document.body.style.background=bg==='transparent'?'transparent':bg; window.READY=true; return; }
  // live preview: fit to window, play, scrub. Space play/pause, arrows step a frame (shift: 1 s), Home to start
  if(Q.has('clean')) document.body.classList.add('clean');
  const fit=()=>{ const k=Math.min(innerWidth/W,(innerHeight-(Q.has('clean')?0:36))/H); el.style.transform=`translate(${(innerWidth-W*k)/2}px,${Math.max(0,(innerHeight-36-H*k)/2)}px) scale(${k})`; };
  fit(); addEventListener('resize',fit);
  const scrub=document.getElementById('scrub'), tc=document.getElementById('tc'), btn=document.getElementById('play');
  // with a soundtrack the preview starts paused (browsers only play sound after a click) and the audio clock drives the picture
  const au=audioUrl?Object.assign(new Audio(audioUrl),{preload:'auto'}):null;
  scrub.max=frames-1; let playing=!au, t0=performance.now(), cur=0;
  const show=t=>{ cur=t; seek(t); scrub.value=Math.round(t*fps); tc.textContent=`${t.toFixed(2)}s  f${Math.round(t*fps)}/${frames}${au&&!playing?'  (play for sound)':''}`; };
  const setPlay=p=>{ playing=p; btn.textContent=p?'pause':'play'; t0=performance.now()-cur*1000; if(au){ if(p){ au.currentTime=cur; au.play().catch(()=>{}); } else au.pause(); } };
  btn.textContent=playing?'pause':'play'; show(0);
  btn.onclick=()=>setPlay(!playing); scrub.oninput=()=>{ setPlay(false); show(scrub.value/fps); };
  addEventListener('keydown',e=>{ if(e.key===' '){ e.preventDefault(); setPlay(!playing); } else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ setPlay(false);
      show(M.clamp(Math.round(cur*fps)/fps+(e.key==='ArrowRight'?1:-1)*(e.shiftKey?1:1/fps),0,(frames-1)/fps)); } else if(e.key==='Home'){ show(0); setPlay(playing); } });
  const tick=()=>{ if(playing){ let t=((performance.now()-t0)/1000)%duration;
      if(au&&!au.paused){ t=au.currentTime; if(t>=duration||au.ended){ au.currentTime=0; au.play().catch(()=>{}); t=0; } }
      else if(au&&t<cur){ au.currentTime=t; au.play().catch(()=>{}); } // wrapped around the loop
      show(t); } requestAnimationFrame(tick); }; tick();
})().catch(e=>{ if(!RENDER) showErr((location.protocol==='file:'?'Opened from file://, where fetch, fonts and modules are blocked. Serve the folder instead: python3 -m http.server, then open /src/stage.html\n\n':'')+(e.stack||e.message)); window.LOAD_ERROR=e.message; throw e; });
}
</script>
</body></html>
