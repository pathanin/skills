    for(let gx=Math.max(0,Math.floor((Math.min(ax,bx)-hw)/GS)),x1=Math.min(GX-1,Math.floor((Math.max(ax,bx)+hw)/GS));gx<=x1;gx++){ const x=(gx+.5)*GS-ax, y=(gy+.5)*GS-ay, u=x*s.dx+y*s.dy, v=y*s.dx-x*s.dy;

  for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++){ const sx=clamp(x+i*d,0,W-.01), sy=clamp(y+j*d,0,H-.01), q=gi(sx,sy)*3; if(LC[q]<0) return true; let m=1e9;
    for(const [ox,oy] of [[0,0],[t,0],[-t,0],[0,t],[0,-t]]){ const X=clamp(sx+ox,0,W-.01), Y=clamp(sy+oy,0,H-.01), c=r.cfs?r.cfs(X,Y,w):colorAt(X,Y);

let P=[]; const add=s=>P.push(s), lay=()=>{ P.sort((a,b)=>a.r-b.r).forEach(s=>{ paint(s); stamp(s); n++; }); P=[]; }; // stable sort: generation order within a region
// the underpainting is never masked: its soft, broken lay-in is what keeps paint-over edges from looking cut out
for(let i=0,N=Math.round(1500*A);i<N;i++) add(Object.assign(oilStroke(rnd(W),rnd(H),rnd(14,24),rnd(8,11),.35,.3),{mk:null})); lay();
// slabs: big brush strokes (a few knife strokes on the widest) where the region is open (sky, sea, broad hills). Sizes are heavy-tailed, 7..28 units, most near 10;
// a slab shrinks until the region's own colour is near-flat across it, so gradients and halos get smaller strokes where they change fast
// bsf(x,y): a region's openness per point, so brush size can blend smoothly instead of switching at a region border (paint-over)
const opn=(r,x,y)=>REG[r].bsf?REG[r].bsf(x,y):REG[r].open;
for(let i=0,N=Math.round(1000*A);i<N;i++){ const x=rnd(W), y=rnd(H), r=idAt(x,y), g=R(), u=R(), kn=R(); let w=7*4**(u*u);
  if(g>=opn(r,x,y)) continue; const c=regCol(REG[r],x,y), far=(ox,oy)=>{ const d=regCol(REG[r],clamp(x+ox,0,W),clamp(y+oy,0,H)); return Math.max(...d.map((v,i)=>Math.abs(v-c[i]))); };
  while(w>7&&Math.max(far(w/2,0),far(-w/2,0),far(0,w/2),far(0,-w/2))>26) w*=.8;
  const knife=w>=16&&kn<.035, st=oilStroke(x,y,w*(knife?rnd(1.2,2):rnd(1.6,2.6)),w,knife?.7:.9,1,knife); add(st); } lay();
// Use the largest brush that makes sense: a mid or fine stroke lands where the canvas still misses the scene at its scale (need, threshold T: region's T, else 16),
// plus a small random share in detail regions only (none in fully open ones), so small strokes never carpet the canvas.
// Paint-over (a region with cfs) places mid and fine strokes only there, from more candidates, so a big stroke that got it right is never painted over
const PO=REG.some(r=>r.cfs), TA=(x,y)=>REG[idAt(x,y)].T??16;
for(let i=0,N=Math.round(5200*A*(PO?1.4:1));i<N;i++){ const x=rnd(W), y=rnd(H), g=R(); if(PO?need(x,y,4.5,TA(x,y)):g<.35*(1-opn(idAt(x,y),x,y))||need(x,y,4.5,TA(x,y))) add(lt(oilStroke(x,y,rnd(7,12),rnd(3.5,5.5),.7),.7)); } lay();
for(let i=0,N=Math.round(3500*A*(PO?1.6:1));i<N;i++){ const x=rnd(W), y=rnd(H), g=R(); if(PO?need(x,y,2.4,TA(x,y)):g<.15*(1-opn(idAt(x,y),x,y))||need(x,y,2.4,TA(x,y))) add(lt(oilStroke(x,y,rnd(4,8),rnd(1.8,3),1),.5)); } lay();
// lost and found edges: where the two sides of a border are close in value, a dry brush drags along the border and blends them (lost);
// far values or hues, small shapes (thick under ~12 to 30 units, so a house or a grass cap) and bs:0 focal shapes keep a hard (found) edge. A slow wave along the contour loses some stretches and finds others
const lumv=c=>.3*c[0]+.59*c[1]+.11*c[2], soften=(x,y,r)=>{ let nx=0, ny=0, q=-1;
  for(let i=0;i<8;i++){ const a=i*TAU/8, id=idAt(x+3*Math.cos(a),y+3*Math.sin(a)); if(id<r){ nx+=Math.cos(a); ny+=Math.sin(a); if(q<0||id>q) q=id; } }
  const nl=Math.hypot(nx,ny); if(q<0||!nl||REG[r].bs===0||REG[q].bs===0||REG[r].thick<4||REG[q].thick<4) return; nx/=nl; ny/=nl;
  let t=0; while(t<3&&idAt(x+nx*t,y+ny*t)>=r) t+=.5; const bx=clamp(x+nx*t,0,W-.01), by=clamp(y+ny*t,0,H-.01); // the border, toward the region behind
  const cr=regCol(REG[r],clamp(bx-2*nx,0,W-.01),clamp(by-2*ny,0,H-.01)), cq=regCol(REG[q],clamp(bx+2*nx,0,W-.01),clamp(by+2*ny,0,H-.01));
  if(R()>=sstep(12,30,REG[r].thick)*(1-sstep(10,36,Math.abs(lumv(cr)-lumv(cq))))*(1-sstep(60,140,cdist(cr,cq)))*(.35+.65*(.5+.5*Math.sin(bx*.06+by*.045)))) return;
  const s=oilStroke(x,y,1,3,1), L=rnd(3,14)/2, a=angleAt(bx,by,q), dx=Math.cos(a), dy=Math.sin(a), sh=rnd(-.7,.7)*L, cx=bx+dx*sh, cy=by+dy*sh, col=mixc(cr,cq,.5); // oilStroke only for its per-stroke draws; the stroke follows the flow of the region behind, dragging the edge into it (a house into the ground, not down it)
  Object.assign(s,{p0:[cx-dx*L,cy-dy*L],p1:[cx+dx*L,cy+dy*L],dx,dy,w:rnd(2.5,4.5),bend:s.bend*.3,col:mixc(cr,cq,.3),col2:mixc(cr,cq,.8),base:col,thick:.55,wet:.45,depl:rnd(.3,.7),mk:null}); add(lt(s,.6)); }; // staggered along the flow so their ends don't line up into a new edge; bristles streak two in-between tones (broken colour) and run dry, so the blend keeps a stroke's texture
let e=0, tries=0; const N3=Math.round(1050*A*.7); while(e<N3&&tries++<N3*100){ const x=rnd(W), y=rnd(H), r=idAt(x,y); if(r>idAt(x+3,y)||r>idAt(x,y+3)||r>idAt(x-3,y)||r>idAt(x,y-3)){ add(lt(oilStroke(x,y,rnd(4,8),rnd(1.8,3),1),.5)); soften(x,y,r); e++; } } lay();
REG.forEach((r,ri)=>{ if(r.area<900){ const m=r.area<30?12:40; for(let q=0;q<m;q++){ const x=rnd(r.box[0],r.box[2]), y=rnd(r.box[1],r.box[3]); if(idAt(x,y)===ri) add(lt(oilStroke(x,y,rnd(2,6),r.area<30?rnd(.8,1.4):rnd(1.2,2),1.1),.4)); } } }); lay();
// highlights as dots (opt-in, hl(x,y) on a region): a small thick dab of the true colour where the scene is much brighter than its surroundings
REG.forEach((r,ri)=>{ if(r.hl) for(let q=0,m=Math.round(r.area*.25);q<m;q++){ const x=rnd(r.box[0],r.box[2]), y=rnd(r.box[1],r.box[3]); if(idAt(x,y)!==ri||!r.hl(x,y)) continue;
  const st=oilStroke(x,y,rnd(.8,2),rnd(.9,1.5),1.6), c=colorAt(x,y); st.col=c; st.col2=c; add(lt(st,.2)); } }); lay();
// light: raking from the upper left. Diffuse is linear in the slope, so bumps don't darken the scene on average. Specular only where
// the paint is thick (bare linen and thin scumbles stay matte). The weave pushes up through thin paint. A faint falloff, as in a photo.
const L0=-.5, L1=-.62, L2=.6, ll=Math.hypot(L0,L1,L2), lx=L0/ll, ly=L1/ll, lz=L2/ll, hl=Math.hypot(lx,ly,lz+1), hx=lx/hl, hy=ly/hl, hz=(lz+1)/hl, SPE=10, s0=hz**SPE;
const TT=new Float32Array(NP), RB=Math.max(1,Math.round(k*.4)); // cavity blur radius (px)
for(let q=0;q<NP;q++){ const h=HT[q]; TT[q]=h+.4*WV[q]/255/(1+(h/.3)**4); /* the weave shows through thin paint only: impasto buries it */ WV[q]=255*sstep(0,.15,h)*(.45+.55*sstep(.1,.8,h)); } // WV now holds gloss: bare linen is matte, oil has a sheen even where thin, impasto shines
{ const tmp=new Float32Array(Math.max(PX,PY)); // separable box blur TT -> HT
  for(let y=0;y<PY;y++){ const r=y*PX; let acc=0; for(let x=-RB;x<=RB;x++) acc+=TT[r+clamp(x,0,PX-1)];
    for(let x=0;x<PX;x++){ tmp[x]=acc/(2*RB+1); acc+=TT[r+Math.min(PX-1,x+RB+1)]-TT[r+Math.max(0,x-RB)]; } HT.set(tmp.subarray(0,PX),r); }
  for(let x=0;x<PX;x++){ let acc=0; for(let y=-RB;y<=RB;y++) acc+=HT[clamp(y,0,PY-1)*PX+x];
    for(let y=0;y<PY;y++){ tmp[y]=acc/(2*RB+1); acc+=HT[Math.min(PY-1,y+RB+1)*PX+x]-HT[Math.max(0,y-RB)*PX+x]; } for(let y=0;y<PY;y++) HT[y*PX+x]=tmp[y]; } }
for(let py=0;py<PY;py++){ const up=(py?py-1:0)*PX, dn=(py<PY-1?py+1:py)*PX, row=py*PX;
  for(let px=0;px<PX;px++){ const q=row+px, gx=(TT[px<PX-1?q+1:q]-TT[px?q-1:q])*.55, gy=(TT[dn+px]-TT[up+px])*.55, iz=1/Math.sqrt(gx*gx+gy*gy+1);
    const ig=1/Math.sqrt(9*(gx*gx+gy*gy)+1), ndh=(-3*gx*hx-3*gy*hy+hz)*ig, sp=Math.max(0,ndh**SPE-s0)*.7*WV[q], // gloss sees the relief steeper than diffuse does
      cav=clamp((TT[q]-HT[q])*.6,-.12,.08); // grooves hold shadow
    const sh=clamp(1-.75*(gx*lx+gy*ly)/lz,.5,1.5)*(1+cav)*(1+.035*(1-2*(px/PX*.6+py/PY*.4))), o=q*4;
    D[o]=D[o]*sh+sp; D[o+1]=D[o+1]*sh+sp*.97; D[o+2]=D[o+2]*sh+sp*.9; } }
b.putImageData(img,0,0);
// for tests: width (units) of the top-most stroke over the pixels of a box, optionally only where region r shows
window.THK=(x0,y0,x1,y1)=>{ let s=0, n=0; for(let py=Math.round(y0*k);py<Math.round(y1*k);py++) for(let px=Math.round(x0*k);px<Math.round(x1*k);px++){ s+=TT[py*PX+px]; n++; } return s/(n||1); }; // for tests: mean paint height over a box
window.TWAT=(x,y)=>TW[Math.min(PY-1,Math.floor(y*k))*PX+Math.min(PX-1,Math.floor(x*k))]/4; // for tests: width (units) of the top-most stroke at a point
window.VIS=(x0,y0,x1,y1,r)=>{ const v=[], L=[0,0,0,0]; for(let py=Math.round(y0*k);py<Math.round(y1*k);py++) for(let px=Math.round(x0*k);px<Math.round(x1*k);px++){ const q=py*PX+px, t=TW[q];
    if(t&&(r===undefined||idAt((px+.5)/k,(py+.5)/k)===r)){ v.push(t/4); const b=t>=48?0:2; L[b]+=.3*D[q*4]+.59*D[q*4+1]+.11*D[q*4+2]; L[b+1]++; } }
  v.sort((a,b)=>a-b); return {n:v.length, big:v.filter(w=>w>=12).length/(v.length||1), p90:v[Math.floor(v.length*.9)]||0, lumBig:L[0]/(L[1]||1), lumSmall:L[2]/(L[3]||1)}; };
}
window.DONE=n;
}
